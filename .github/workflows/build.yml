name: Build Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install uvbox
        run: uvx uvbox --help

      - name: Build with uvbox (all platforms)
        run: uvx uvbox pypi --config uvbox.toml

      - name: List built artifacts
        run: ls -laR dist/

      - name: Upload all binaries
        uses: actions/upload-artifact@v4
        with:
          name: pyopenms-viewer-binaries
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyopenms-viewer-binaries
          path: binaries

      - name: Create zip archives for release
        run: |
          cd binaries
          ls -la
          for file in *; do
            if [ -f "$file" ]; then
              zip "${file}.zip" "$file"
            fi
          done
          ls -la *.zip
          mv *.zip ../
          cd ..
          ls -la *.zip

      - name: Create or update GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Tag: $TAG"

          # Create release if it doesn't exist; otherwise upload and overwrite assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists for $TAG, uploading assets with --clobber"
            gh release upload "$TAG" *.zip --clobber || true
          else
            echo "Creating release for $TAG and uploading assets"
            gh release create "$TAG" *.zip --generate-notes || true
          fi
