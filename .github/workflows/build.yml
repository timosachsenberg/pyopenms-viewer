name: Build Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install uvbox
        run: uvx uvbox --help

      - name: Build with uvbox (all platforms)
        run: uvx uvbox pypi --config uvbox.toml

      - name: List built artifacts
        run: ls -laR dist/

      - name: Upload macOS ARM64
        uses: actions/upload-artifact@v4
        with:
          name: pyopenms-viewer-macos-arm64
          path: dist/pyopenms-viewer-aarch64-apple-darwin.tar.gz

      - name: Upload macOS x64
        uses: actions/upload-artifact@v4
        with:
          name: pyopenms-viewer-macos-x64
          path: dist/pyopenms-viewer-x86_64-apple-darwin.tar.gz

      - name: Upload Linux ARM64
        uses: actions/upload-artifact@v4
        with:
          name: pyopenms-viewer-linux-arm64
          path: dist/pyopenms-viewer-aarch64-unknown-linux-gnu.tar.gz

      - name: Upload Linux x64
        uses: actions/upload-artifact@v4
        with:
          name: pyopenms-viewer-linux-x64
          path: dist/pyopenms-viewer-x86_64-unknown-linux-gnu.tar.gz

      - name: Upload Windows ARM64
        uses: actions/upload-artifact@v4
        with:
          name: pyopenms-viewer-windows-arm64
          path: dist/pyopenms-viewer-aarch64-pc-windows-msvc.zip

      - name: Upload Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: pyopenms-viewer-windows-x64
          path: dist/pyopenms-viewer-x86_64-pc-windows-msvc.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create or update GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Tag: $TAG"

          # Create release if it doesn't exist; otherwise upload and overwrite assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists for $TAG, uploading assets with --clobber"
            gh release upload "$TAG" release/* --clobber || true
          else
            echo "Creating release for $TAG and uploading assets"
            gh release create "$TAG" release/* --generate-notes || true
          fi
