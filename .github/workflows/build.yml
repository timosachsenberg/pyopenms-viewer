name: Build Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install uvbox
        run: uvx uvbox --help

      - name: Build with uvbox (all platforms)
        run: uvx uvbox pypi --config uvbox.toml

      - name: List built artifacts
        run: ls -la dist/

      - name: Upload Linux x64
        uses: actions/upload-artifact@v4
        with:
          name: pyopenms-viewer-linux-x64
          path: dist/*linux*amd64*

      - name: Upload Linux ARM64
        uses: actions/upload-artifact@v4
        with:
          name: pyopenms-viewer-linux-arm64
          path: dist/*linux*arm64*

      - name: Upload macOS x64
        uses: actions/upload-artifact@v4
        with:
          name: pyopenms-viewer-macos-x64
          path: dist/*darwin*amd64*

      - name: Upload macOS ARM64
        uses: actions/upload-artifact@v4
        with:
          name: pyopenms-viewer-macos-arm64
          path: dist/*darwin*arm64*

      - name: Upload Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: pyopenms-viewer-windows-x64
          path: dist/*windows*amd64*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create zip archives for release
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done
          ls -la *.zip

      - name: Create or update GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Tag: $TAG"

          # Create release if it doesn't exist; otherwise upload and overwrite assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists for $TAG, uploading assets with --clobber"
            gh release upload "$TAG" artifacts/*.zip --clobber || true
          else
            echo "Creating release for $TAG and uploading assets"
            gh release create "$TAG" artifacts/*.zip --generate-notes || true
          fi
