name: Linux EXE Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  linux-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib
          pip install --extra-index-url https://pypi.openms.de/simple/ "pyopenms==3.6.0.dev20260815" -e ".[native]"

      - name: Build Linux binary
        run: pyinstaller --noconfirm pyopenms-viewer-linux.spec

      - name: Verify dist contents
        run: ls -lh dist

      - name: Smoke test --help output
        run: ./dist/pyopenms-viewer --help

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyopenms-viewer-linux-smoke
          path: dist/pyopenms-viewer
