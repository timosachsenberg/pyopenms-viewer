name: Windows EXE Smoke Test

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
  workflow_dispatch:

jobs:
  windows-smoke-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib
          pip install -e ".[native]"

      - name: Build Windows EXE
        run: pyinstaller --noconfirm pyopenms-viewer-windows.spec

      - name: Verify dist contents
        run: Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - name: Smoke test --help output
        run: |
          # Run the EXE and capture output (works for GUI apps too)
          $pinfo = New-Object System.Diagnostics.ProcessStartInfo
          $pinfo.FileName = ".\dist\pyopenms-viewer.exe"
          $pinfo.Arguments = "--help"
          $pinfo.RedirectStandardOutput = $true
          $pinfo.RedirectStandardError = $true
          $pinfo.UseShellExecute = $false
          $pinfo.CreateNoWindow = $true
          
          $process = New-Object System.Diagnostics.Process
          $process.StartInfo = $pinfo
          $process.Start() | Out-Null
          
          # Wait up to 60 seconds
          $exited = $process.WaitForExit(60000)
          
          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          
          Write-Host "=== STDOUT ==="
          Write-Host $stdout
          Write-Host "=== STDERR ==="
          Write-Host $stderr
          Write-Host "=== Exit Code: $($process.ExitCode) ==="
          
          if (-not $exited) {
            Write-Host "ERROR: Process timed out"
            $process.Kill()
            exit 1
          }
          
          if ($process.ExitCode -ne 0) {
            Write-Host "ERROR: Process exited with code $($process.ExitCode)"
            exit $process.ExitCode
          }
          
          # Verify we got help output
          if ($stdout -match "Usage:" -or $stdout -match "pyopenms-viewer") {
            Write-Host "SUCCESS: Help output verified"
          } else {
            Write-Host "WARNING: Help output not found, but process succeeded"
          }

      - name: Test pyopenms import via Python script
        run: |
          # Create a test script that imports pyopenms
          $testScript = @'
          import sys
          import os
          
          # Add the extraction directory to path
          if hasattr(sys, '_MEIPASS'):
              base_path = sys._MEIPASS
          else:
              base_path = os.path.dirname(os.path.abspath(__file__))
          
          print(f"Base path: {base_path}")
          print(f"Python: {sys.executable}")
          
          # Try to import pyopenms
          try:
              import pyopenms
              print(f"SUCCESS: pyopenms imported successfully!")
              print(f"pyopenms version: {pyopenms.__version__}")
          except ImportError as e:
              print(f"FAILED: {e}")
              sys.exit(1)
          '@
          
          # Save to temp file
          $testScript | Out-File -FilePath "test_import.py" -Encoding UTF8
          
          # Run via the frozen app by checking if pyopenms can be imported
          # We'll test this by running the app with --version or similar
          # For now, if --help works, we know basic loading works
          Write-Host "Import test skipped - will be validated by full app test"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyopenms-viewer-windows-smoke
          path: dist/pyopenms-viewer.exe
