[project]
name = "pyopenms-viewer"
version = "0.2.1"
description = "Fast mzML peak map viewer using NiceGUI, Datashader, and pyOpenMS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Timo Sachsenberg"},
    {name = "OpenMS Team"}
]
keywords = ["mass-spectrometry", "proteomics", "visualization", "mzML", "OpenMS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "nicegui>=3.11.1",
    "datashader>=0.18.2",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "colorcet>=3.0.0",
    "pillow>=10.0.0",
    # Nightly after OpenMS PR #9908 (imzML per-peak IM aux arrays).
    "pyopenms==3.6.0.dev20260815",
    "pyopenms-viz>=0.1.0",
    "click>=8.0.0",
    "plotly>=5.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "dask[dataframe]>=2024.0.0",
    "xarray>=2023.0.0",
]

[project.optional-dependencies]
native = [
    "pywebview>=4.0.0",
    "qtpy>=2.0.0",
    "PyQt6>=6.0.0",
    "PyQt6-WebEngine>=6.0.0",
]
gpu = [
    # NVIDIA RAPIDS cuDF for GPU-accelerated datashader rendering
    # Only available on Linux x86_64 with CUDA support
    # Requires: pip install --extra-index-url https://pypi.nvidia.com
    "cudf-cu12>=24.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "pyinstaller>=6.0.0",
]
e2e = [
    # Browser-driven end-to-end tests (tests/e2e). Requires a one-time
    # `playwright install chromium` to fetch the browser binary.
    "pytest>=7.0.0",
    "playwright>=1.40.0",
]

[project.scripts]
pyopenms-viewer = "pyopenms_viewer.cli:main"

[project.urls]
Homepage = "https://github.com/OpenMS/OpenMS"
Documentation = "https://openms.de/documentation/"
Repository = "https://github.com/OpenMS/OpenMS"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyopenms_viewer"]

[tool.pytest.ini_options]
# Keep collection in tests/ — root-level scripts named test_* are not the suite.
testpaths = ["tests"]
# Browser-driven e2e tests are opt-in (they launch the app + a headless browser).
# Run them explicitly with: pytest tests/e2e -m e2e
addopts = "-m 'not e2e'"
markers = [
    "e2e: browser-driven end-to-end tests (launch the app, drive it with Playwright)",
]

[tool.ruff]

[tool.pip]
extra-index-url = ["https://pypi.openms.de/simple/"]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.uv]
# Use system TLS certificates for HTTPS (fixes UnknownIssuer for private index)
native-tls = true

[tool.uv.sources]
# Pin `pyopenms` to the OpenMS nightly index so it's always resolved from there
pyopenms = { index = "openms-nightly" }

[[tool.uv.index]]
name = "openms-nightly"
url = "https://pypi.openms.de/simple/"
authenticate = "never"